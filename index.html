<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Part Compare</title>
    <style>
        /* Light Mode (Default) Variables */
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --primary: #3b82f6; /* Slightly lighter blue for dark backgrounds */
            --bg: #0f172a;      /* Deep slate */
            --surface: #1e293b; /* Lighter slate for cards/header */
            --text: #f8fafc;    /* Near white */
            --text-light: #94a3b8;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--surface);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container input {
            padding: 0.75rem;
            width: 300px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .theme-toggle {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg);
        }

        .layout {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            height: fit-content;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        .filter-label {
            display: block;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px var(--shadow);
        }

        .category-badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
            margin: 1rem 0;
        }

        .specs {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background: #1d4ed8;
        }

        .no-results {
            text-align: center;
            color: var(--text-light);
            grid-column: 1 / -1;
            padding: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h2>PC Part Compare</h2>
        <div class="header-controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for CPU, GPU, RAM...">
            </div>
            <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Category</h3>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="CPU"> Processors (CPU)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="GPU"> Graphics Cards (GPU)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="RAM"> Memory (RAM)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="Motherboard"> Motherboards</label>
            </div>

            <div class="filter-group">
                <h3>Max Price: $<span id="priceValue">2000</span></h3>
                <input type="range" id="priceRange" min="50" max="2000" value="2000" style="width: 100%;">
            </div>
        </aside>

        <main class="main-content">
            <div class="grid" id="productGrid">
                <!-- Products will be generated here by JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // --- Theme Toggle Logic ---
        const themeToggleBtn = document.getElementById('themeToggle');
        
        // Check for saved theme preference in LocalStorage
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️ Light';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            // Update button text and save to LocalStorage
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = '☀️ Light';
                localStorage.setItem('theme', 'dark');
            } else {
                themeToggleBtn.textContent = '🌙 Dark';
                localStorage.setItem('theme', 'light');
            }
        });

        // --- Mock Database of PC Parts ---
        const partsDatabase = [
            { id: 1, name: "Intel Core i9-14900K", category: "CPU", price: 589, specs: "24 Cores (8P+16E), 32 Threads, Up to 6.0 GHz" },
            { id: 2, name: "AMD Ryzen 7 7800X3D", category: "CPU", price: 399, specs: "8 Cores, 16 Threads, 3D V-Cache, Up to 5.0 GHz" },
            { id: 3, name: "NVIDIA GeForce RTX 4090", category: "GPU", price: 1599, specs: "24GB GDDR6X, 16384 CUDA Cores, DLSS 3" },
            { id: 4, name: "AMD Radeon RX 7900 XTX", category: "GPU", price: 999, specs: "24GB GDDR6, 6144 Stream Processors" },
            { id: 5, name: "Corsair Vengeance 32GB", category: "RAM", price: 115, specs: "2x16GB, DDR5-6000MHz, CL30" },
            { id: 6, name: "G.Skill Trident Z5 64GB", category: "RAM", price: 210, specs: "2x32GB, DDR5-6400MHz, CL32" },
            { id: 7, name: "ASUS ROG Strix X670E-E", category: "Motherboard", price: 479, specs: "AM5 Socket, PCIe 5.0, WiFi 6E, DDR5" },
            { id: 8, name: "MSI MAG Z790 Tomahawk", category: "Motherboard", price: 259, specs: "LGA 1700, WiFi 6E, PCIe 5.0" },
            { id: 9, name: "NVIDIA GeForce RTX 4070 Super", category: "GPU", price: 599, specs: "12GB GDDR6X, 7168 CUDA Cores" }
        ];

        // --- DOM Elements ---
        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const priceRange = document.getElementById('priceRange');
        const priceValue = document.getElementById('priceValue');
        const categoryCheckboxes = document.querySelectorAll('.category-filter');

        // --- Render Function ---
        function renderProducts(products) {
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results"><h3>No parts found</h3><p>Try adjusting your search or filters.</p></div>';
                return;
            }

            products.forEach(part => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="category-badge">${part.category}</span>
                    <h3 style="margin-top: 0.5rem;">${part.name}</h3>
                    <div class="price">$${part.price}</div>
                    <div class="specs">
                        <strong>Specifications:</strong><br>
                        ${part.specs}
                    </div>
                    <button class="btn">Compare</button>
                `;
                grid.appendChild(card);
            });
        }

        // --- Filter Logic ---
        function filterProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            const maxPrice = parseInt(priceRange.value);
            
            const activeCategories = Array.from(categoryCheckboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            const filtered = partsDatabase.filter(part => {
                const matchesSearch = part.name.toLowerCase().includes(searchTerm) || 
                                      part.specs.toLowerCase().includes(searchTerm);
                const matchesPrice = part.price <= maxPrice;
                const matchesCategory = activeCategories.length === 0 || activeCategories.includes(part.category);

                return matchesSearch && matchesPrice && matchesCategory;
            });

            renderProducts(filtered);
        }

        // --- Event Listeners ---
        searchInput.addEventListener('input', filterProducts);
        
        priceRange.addEventListener('input', (e) => {
            priceValue.textContent = e.target.value;
            filterProducts();
        });

        categoryCheckboxes.forEach(cb => {
            cb.addEventListener('change', filterProducts);
        });

        // Initial Render
        renderProducts(partsDatabase);
    </script>
</body>
</html>
