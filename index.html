<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Part Compare</title>
    <style>
        /* Light Mode (Default) Variables */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --primary: #3b82f6; 
            --primary-hover: #60a5fa;
            --success: #10b981;
            --success-hover: #34d399;
            --danger: #f87171;
            --bg: #0f172a;      
            --surface: #1e293b; 
            --text: #f8fafc;    
            --text-light: #94a3b8;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.5);
            --modal-overlay: rgba(15, 23, 42, 0.8);
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--surface);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container input {
            padding: 0.75rem;
            width: 300px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .theme-toggle {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg);
        }

        .layout {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            height: fit-content;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        .filter-label {
            display: block;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px var(--shadow);
        }

        .category-badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 0.5rem;
            width: fit-content;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
            margin: 1rem 0;
        }

        .specs {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        .btn:hover { background: var(--primary-hover); }

        .btn.selected { background: var(--success); }
        .btn.selected:hover { background: var(--success-hover); }

        .btn-remove { background: var(--danger); width: auto; padding: 0.5rem 1rem;}
        .btn-remove:hover { background: #b91c1c; }

        .no-results {
            text-align: center;
            color: var(--text-light);
            grid-column: 1 / -1;
            padding: 3rem;
        }

        /* --- Floating Compare Button --- */
        .floating-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px var(--shadow);
            z-index: 99;
            transition: transform 0.2s, background-color 0.3s;
            display: none; /* Hidden by default */
        }
        .floating-btn:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
        }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover {
            color: var(--text);
        }

        /* --- Comparison Table Styles --- */
        .table-responsive {
            overflow-x: auto;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .compare-table th, .compare-table td {
            padding: 1rem;
            border: 1px solid var(--border);
            min-width: 150px;
            vertical-align: top;
        }

        .compare-table th {
            background-color: var(--bg);
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .compare-table td:first-child {
            font-weight: bold;
            background-color: var(--bg);
            width: 150px;
        }
    </style>
</head>
<body>

    <header>
        <h2>PC Part Compare</h2>
        <div class="header-controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for CPU, GPU, RAM...">
            </div>
            <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Category</h3>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="CPU"> Processors (CPU)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="GPU"> Graphics Cards (GPU)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="RAM"> Memory (RAM)</label>
                <label class="filter-label"><input type="checkbox" class="category-filter" value="Motherboard"> Motherboards</label>
            </div>

            <div class="filter-group">
                <h3>Max Price: $<span id="priceValue">2000</span></h3>
                <input type="range" id="priceRange" min="50" max="2000" value="2000" style="width: 100%;">
            </div>
        </aside>

        <main class="main-content">
            <div class="grid" id="productGrid">
                <!-- Products will be generated here by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Floating Button -->
    <button id="floatingCompareBtn" class="floating-btn">Compare (0)</button>

    <!-- Comparison Modal -->
    <div id="compareModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin: 0;">Side-by-Side Comparison</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="table-responsive" id="compareTableContainer">
                <!-- Table generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- Theme Toggle Logic ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️ Light';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = '☀️ Light';
                localStorage.setItem('theme', 'dark');
            } else {
                themeToggleBtn.textContent = '🌙 Dark';
                localStorage.setItem('theme', 'light');
            }
        });

        // --- Mock Database ---
        const partsDatabase = [
            { id: 1, name: "Intel Core i9-14900K", category: "CPU", price: 589, specs: "24 Cores (8P+16E), 32 Threads, Up to 6.0 GHz" },
            { id: 2, name: "AMD Ryzen 7 7800X3D", category: "CPU", price: 399, specs: "8 Cores, 16 Threads, 3D V-Cache, Up to 5.0 GHz" },
            { id: 3, name: "NVIDIA GeForce RTX 4090", category: "GPU", price: 1599, specs: "24GB GDDR6X, 16384 CUDA Cores, DLSS 3" },
            { id: 4, name: "AMD Radeon RX 7900 XTX", category: "GPU", price: 999, specs: "24GB GDDR6, 6144 Stream Processors" },
            { id: 5, name: "Corsair Vengeance 32GB", category: "RAM", price: 115, specs: "2x16GB, DDR5-6000MHz, CL30" },
            { id: 6, name: "G.Skill Trident Z5 64GB", category: "RAM", price: 210, specs: "2x32GB, DDR5-6400MHz, CL32" },
            { id: 7, name: "ASUS ROG Strix X670E-E", category: "Motherboard", price: 479, specs: "AM5 Socket, PCIe 5.0, WiFi 6E, DDR5" },
            { id: 8, name: "MSI MAG Z790 Tomahawk", category: "Motherboard", price: 259, specs: "LGA 1700, WiFi 6E, PCIe 5.0" },
            { id: 9, name: "NVIDIA GeForce RTX 4070 Super", category: "GPU", price: 599, specs: "12GB GDDR6X, 7168 CUDA Cores" }
        ];

        // --- State ---
        let currentFilteredProducts = partsDatabase;
        let comparisonList = [];

        // --- DOM Elements ---
        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const priceRange = document.getElementById('priceRange');
        const priceValue = document.getElementById('priceValue');
        const categoryCheckboxes = document.querySelectorAll('.category-filter');
        const floatingCompareBtn = document.getElementById('floatingCompareBtn');
        const compareModal = document.getElementById('compareModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const compareTableContainer = document.getElementById('compareTableContainer');

        // --- Core Functions ---

        // Render the main grid
        function renderProducts(products) {
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results"><h3>No parts found</h3><p>Try adjusting your search or filters.</p></div>';
                return;
            }

            products.forEach(part => {
                const isCompared = comparisonList.includes(part.id);
                const btnClass = isCompared ? 'btn selected' : 'btn';
                const btnText = isCompared ? '✓ Added to Compare' : 'Add to Compare';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="category-badge">${part.category}</span>
                    <h3 style="margin-top: 0.5rem;">${part.name}</h3>
                    <div class="price">$${part.price}</div>
                    <div class="specs">
                        <strong>Specifications:</strong><br>
                        ${part.specs}
                    </div>
                    <button class="${btnClass}" onclick="toggleCompare(${part.id})">${btnText}</button>
                `;
                grid.appendChild(card);
            });
        }

        // Handle adding/removing items from comparison
        function toggleCompare(id) {
            const index = comparisonList.indexOf(id);
            if (index > -1) {
                comparisonList.splice(index, 1); // Remove it
            } else {
                if (comparisonList.length >= 4) {
                    alert("You can only compare up to 4 items side-by-side.");
                    return;
                }
                comparisonList.push(id); // Add it
            }
            
            // Re-render the grid to update button colors
            renderProducts(currentFilteredProducts);
            updateFloatingButton();
            
            // If the modal is currently open, update the table live
            if (compareModal.style.display === 'flex') {
                renderComparisonTable();
                if(comparisonList.length === 0) closeModal(); // Close if empty
            }
        }

        function updateFloatingButton() {
            if (comparisonList.length > 0) {
                floatingCompareBtn.style.display = 'block';
                floatingCompareBtn.textContent = `View Comparison (${comparisonList.length})`;
            } else {
                floatingCompareBtn.style.display = 'none';
            }
        }

        // Generate the HTML table for the modal
        function renderComparisonTable() {
            if (comparisonList.length === 0) {
                compareTableContainer.innerHTML = '<p>No items selected.</p>';
                return;
            }

            const itemsToCompare = comparisonList.map(id => partsDatabase.find(p => p.id === id));

            let html = '<table class="compare-table">';
            
            // Row 1: Header/Names
            html += '<tr><th>Feature</th>';
            itemsToCompare.forEach(item => {
                html += `<th>${item.name}</th>`;
            });
            html += '</tr>';

            // Row 2: Category
            html += '<tr><td>Category</td>';
            itemsToCompare.forEach(item => {
                html += `<td><span class="category-badge">${item.category}</span></td>`;
            });
            html += '</tr>';

            // Row 3: Price
            html += '<tr><td>Price</td>';
            itemsToCompare.forEach(item => {
                html += `<td class="price">$${item.price}</td>`;
            });
            html += '</tr>';

            // Row 4: Specifications
            html += '<tr><td>Specifications</td>';
            itemsToCompare.forEach(item => {
                html += `<td>${item.specs}</td>`;
            });
            html += '</tr>';

            // Row 5: Action (Remove)
            html += '<tr><td></td>';
            itemsToCompare.forEach(item => {
                html += `<td><button class="btn btn-remove" onclick="toggleCompare(${item.id})">Remove</button></td>`;
            });
            html += '</tr>';

            html += '</table>';
            compareTableContainer.innerHTML = html;
        }

        // Modal Controls
        function openModal() {
            renderComparisonTable();
            compareModal.style.display = 'flex';
        }

        function closeModal() {
            compareModal.style.display = 'none';
        }

        // Filter Logic
        function filterProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            const maxPrice = parseInt(priceRange.value);
            
            const activeCategories = Array.from(categoryCheckboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            currentFilteredProducts = partsDatabase.filter(part => {
                const matchesSearch = part.name.toLowerCase().includes(searchTerm) || 
                                      part.specs.toLowerCase().includes(searchTerm);
                const matchesPrice = part.price <= maxPrice;
                const matchesCategory = activeCategories.length === 0 || activeCategories.includes(part.category);

                return matchesSearch && matchesPrice && matchesCategory;
            });

            renderProducts(currentFilteredProducts);
        }

        // --- Event Listeners ---
        searchInput.addEventListener('input', filterProducts);
        
        priceRange.addEventListener('input', (e) => {
            priceValue.textContent = e.target.value;
            filterProducts();
        });

        categoryCheckboxes.forEach(cb => {
            cb.addEventListener('change', filterProducts);
        });

        floatingCompareBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        
        // Close modal if user clicks outside of the modal content area
        compareModal.addEventListener('click', (e) => {
            if (e.target === compareModal) {
                closeModal();
            }
        });

        // Initial Render
        renderProducts(partsDatabase);
    </script>
</body>
</html>
