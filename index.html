<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Part Compare & Builder</title>
    <style>
        /* Light Mode Variables */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669; 
            --success-hover: #047857;
            --danger: #dc2626; 
            --warning-bg: #fef08a;
            --warning-text: #854d0e;
            --warning-border: #fde047;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #475569; 
            --border: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.1);
            --modal-overlay: rgba(0, 0, 0, 0.6);
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --primary: #3b82f6; 
            --primary-hover: #60a5fa;
            --success: #10b981;
            --success-hover: #34d399;
            --danger: #ef4444;
            --warning-bg: #713f12; 
            --warning-text: #fef08a;
            --warning-border: #854d0e;
            --bg: #0f172a;      
            --surface: #1e293b; 
            --text: #f8fafc;    
            --text-light: #cbd5e1; 
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.5);
            --modal-overlay: rgba(15, 23, 42, 0.85);
        }
        
        *:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
            font-size: 16px; line-height: 1.6; transition: background-color 0.3s, color 0.3s;
        }

        /* --- Warning Banner --- */
        .warning-banner {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border-bottom: 1px solid var(--warning-border);
            text-align: center;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        header {
            background-color: var(--surface);
            padding: 1.25rem 2rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 20;
            box-shadow: 0 4px 6px -1px var(--shadow); flex-wrap: wrap; gap: 1rem;
        }

        header h2 { margin: 0; font-size: 1.5rem; }

        .header-controls { display: flex; gap: 1rem; align-items: center; flex: 1; justify-content: flex-end; }
        .header-buttons { display: flex; gap: 0.5rem; }
        
        .search-container { flex: 1; max-width: 400px; }
        .search-container input {
            padding: 0.85rem 1rem; width: 100%; box-sizing: border-box;
            border: 2px solid var(--border); border-radius: 8px; font-size: 1rem;
            background-color: var(--bg); color: var(--text); transition: all 0.2s;
        }
        .search-container input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

        .theme-toggle {
            background: var(--surface); color: var(--text); border: 2px solid var(--border);
            padding: 0.85rem 1rem; border-radius: 8px; cursor: pointer;
            font-size: 1rem; font-weight: bold; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .theme-toggle:hover { background: var(--bg); border-color: var(--primary); }

        .layout { display: flex; flex: 1; padding: 2rem; gap: 2rem; max-width: 1500px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .sidebar {
            width: 280px; background: var(--surface); padding: 1.5rem;
            border-radius: 12px; border: 1px solid var(--border); height: fit-content;
            position: sticky; top: 100px;
        }

        .filter-menu-details summary {
            font-size: 1.15rem; font-weight: bold; cursor: pointer; padding: 0.85rem 1rem;
            background-color: var(--bg); border: 2px solid var(--border); border-radius: 8px;
            list-style: none; display: flex; justify-content: space-between; align-items: center;
            user-select: none; transition: all 0.2s;
        }
        .filter-menu-details summary::-webkit-details-marker { display: none; }
        .filter-menu-details summary:hover { border-color: var(--primary); }
        .filter-menu-details summary::after { content: '▼'; font-size: 0.8rem; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .filter-menu-details[open] summary::after { transform: rotate(180deg); }
        .filter-menu-details[open] summary { margin-bottom: 1.5rem; background-color: var(--primary); color: white; border-color: var(--primary); }
        .filter-menu-content { animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-group { margin-bottom: 2rem; }
        .filter-group h3 { margin-top: 0; font-size: 1.2rem; margin-bottom: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .filter-label { display: flex; align-items: center; margin-bottom: 0.75rem; cursor: pointer; font-size: 1.05rem; }
        .filter-label input[type="checkbox"] { width: 1.25rem; height: 1.25rem; margin-right: 0.75rem; cursor: pointer; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; cursor: pointer; }
        
        .price-input {
            width: 80px; padding: 0.35rem 0.5rem; border: 2px solid var(--border); border-radius: 6px;
            background-color: var(--bg); color: var(--text); font-size: 1.1rem; font-weight: bold;
            font-family: inherit; transition: border-color 0.2s;
        }
        .price-input:focus { outline: none; border-color: var(--primary); }

        .main-content { flex: 1; }

        .category-section {
            margin-bottom: 2rem; background: var(--surface); border-radius: 12px;
            border: 1px solid var(--border); box-shadow: 0 4px 6px -1px var(--shadow); overflow: hidden;
        }
        .category-section summary {
            font-size: 1.3rem; font-weight: 800; padding: 1.25rem 1.5rem;
            background: var(--surface); cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; transition: background 0.2s; list-style: none;
        }
        .category-section summary::-webkit-details-marker { display: none; }
        .category-section summary:hover { background: var(--bg); }
        .category-section[open] summary { border-bottom: 1px solid var(--border); }
        .category-section summary::after { content: '▼'; font-size: 0.9rem; transition: transform 0.3s; }
        .category-section[open] summary::after { transform: rotate(180deg); }
        
        .category-content {
            padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem; background: var(--bg);
        }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.75rem; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px var(--shadow); cursor: pointer;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px var(--shadow); border-color: var(--primary); }

        .card-img { 
            width: 100%; height: 200px; object-fit: contain; border-radius: 8px; 
            margin-bottom: 1rem; background-color: #ffffff; border: 1px solid var(--border); padding: 0.5rem; box-sizing: border-box;
        }
        
        .category-badge { background: var(--primary); color: white; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; display: none; }
        .card h3 { font-size: 1.25rem; margin: 0.25rem 0; }
        .price { font-size: 1.75rem; font-weight: 800; color: var(--text); margin: 1rem 0; }
        .specs { color: var(--text-light); font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; flex-grow: 1; }
        .specs strong { color: var(--text); display: block; margin-bottom: 0.25rem; }

        .power-draw { display: inline-block; background-color: var(--bg); border: 1px solid var(--border); padding: 0.35rem 0.75rem; border-radius: 6px; font-weight: bold; margin-top: 0.75rem; color: var(--danger); font-size: 0.95rem; }
        .power-draw.psu, .power-draw.case { color: var(--success); }
        body.dark-mode .power-draw { color: #fca5a5; }
        body.dark-mode .power-draw.psu, body.dark-mode .power-draw.case { color: #6ee7b7; }

        .btn { display: block; width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.05rem; font-weight: bold; text-align: center; transition: background-color 0.2s, transform 0.1s; margin-top: 1rem; }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); } 
        .btn.selected { background: var(--success); border: 2px solid transparent; }
        .btn.selected:hover { background: var(--success-hover); }
        .btn-remove { background: var(--danger); width: auto; padding: 0.5rem 1rem; margin-top: 0; }
        .btn-remove:hover { background: #b91c1c; }

        .no-results { text-align: center; color: var(--text-light); grid-column: 1 / -1; padding: 4rem 2rem; background: var(--surface); border-radius: 12px; border: 1px dashed var(--border); }

        .floating-btn { position: fixed; bottom: 2rem; right: 2rem; background: var(--primary); color: white; border: none; padding: 1.25rem 2.5rem; border-radius: 50px; font-size: 1.15rem; font-weight: bold; cursor: pointer; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); z-index: 99; transition: transform 0.2s, background-color 0.3s; display: none; }
        .floating-btn:hover { transform: scale(1.05) translateY(-5px); background: var(--primary-hover); }

        /* --- Modals Styles --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(6px); }
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 95%; max-width: 1300px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .details-modal-content { max-width: 900px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; border-bottom: 2px solid var(--border); }
        .modal-header h2 { margin: 0; font-size: 1.5rem; }
        
        .close-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 1.5rem; cursor: pointer; transition: all 0.2s; }
        .close-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .details-body { display: flex; gap: 2rem; padding: 2rem; overflow-y: auto; }
        .details-image { flex: 1; border-radius: 12px; object-fit: contain; width: 100%; max-width: 400px; height: auto; border: 1px solid var(--border); background-color: #ffffff; padding: 1rem;}
        .details-info { flex: 1.5; display: flex; flex-direction: column; gap: 1rem; }
        .details-specs-list { list-style: none; padding: 0; margin: 0; }
        .details-specs-list li { padding: 0.75rem 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .details-specs-list li strong { color: var(--text); }
        .details-specs-list li span { color: var(--text-light); text-align: right; }
        
        .table-responsive { padding: 2rem; overflow-x: auto; flex: 1; }
        .compare-table { width: 100%; border-collapse: collapse; text-align: left; }
        .compare-table th, .compare-table td { padding: 1.25rem; border: 1px solid var(--border); min-width: 200px; vertical-align: middle; }
        .compare-table th { background-color: var(--bg); font-weight: 800; font-size: 1.15rem; }
        .compare-table td:first-child { font-weight: bold; background-color: var(--bg); width: 180px; position: sticky; left: 0; z-index: 2; }
        .compare-table th:first-child { position: sticky; left: 0; z-index: 3; }
        .table-img { width: 100%; max-width: 150px; border-radius: 8px; border: 1px solid var(--border); background-color: #ffffff; }

        /* --- Compatibility Banner Styles --- */
        .compat-success { background-color: var(--success); color: white; padding: 1.25rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: bold; }
        .compat-error { background-color: var(--surface); border: 2px solid var(--danger); padding: 1.25rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .compat-error h3 { margin-top: 0; color: var(--danger); }
        .compat-error ul { margin-bottom: 0; }
        .compat-error li { margin-bottom: 0.5rem; }

        /* =========================================
           RESPONSIVE & VIEW TOGGLE STYLES
           ========================================= */

        @media (max-width: 900px) {
            body:not(.force-desktop) .layout { flex-direction: column; padding: 1rem; }
            body:not(.force-desktop) .sidebar { width: 100%; position: relative; top: 0; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
            body:not(.force-desktop) .header-controls { flex-direction: column-reverse; width: 100%; align-items: stretch; }
            body:not(.force-desktop) .header-buttons { width: 100%; justify-content: space-between; }
            body:not(.force-desktop) .theme-toggle { flex: 1; justify-content: center; }
            body:not(.force-desktop) .search-container { max-width: 100%; }
            body:not(.force-desktop) .category-content { grid-template-columns: 1fr; }
            body:not(.force-desktop) .floating-btn { bottom: 1rem; right: 1rem; left: 1rem; width: calc(100% - 2rem); text-align: center; border-radius: 12px; }
            body:not(.force-desktop) .table-responsive { padding: 1rem; }
            body:not(.force-desktop) .details-body { flex-direction: column; }
            body:not(.force-desktop) .details-image { max-width: 100%; }
        }

        body.force-mobile .layout { flex-direction: column; padding: 1rem; max-width: 600px; margin: 0 auto; }
        body.force-mobile .sidebar { width: 100%; position: relative; top: 0; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
        body.force-mobile .header-controls { flex-direction: column-reverse; width: 100%; align-items: stretch; max-width: 600px; margin: 0 auto; }
        body.force-mobile .header-buttons { width: 100%; justify-content: space-between; }
        body.force-mobile .theme-toggle { flex: 1; justify-content: center; }
        body.force-mobile .search-container { max-width: 100%; }
        body.force-mobile .category-content { grid-template-columns: 1fr; }
        body.force-mobile .floating-btn { bottom: 1rem; right: 0; left: 0; width: calc(100% - 2rem); text-align: center; border-radius: 12px; max-width: 568px; margin: 0 auto; }
        body.force-mobile .table-responsive { padding: 1rem; }
        body.force-mobile .details-body { flex-direction: column; }
        body.force-mobile .details-image { max-width: 100%; }

        body.force-desktop { min-width: 1200px; }

    </style>
</head>
<body>

    <!-- Warning Banner -->
    <div class="warning-banner">
        ⚠️ <strong>Note:</strong> The prices listed below are estimated launch prices, not real-time current market prices.
    </div>

    <header>
        <h2>💻 PC Part Compare & Builder</h2>
        <div class="header-controls">
            <div class="search-container">
                <input type="text" id="searchInput" aria-label="Search components" placeholder="Search for components...">
            </div>
            <div class="header-buttons">
                <button id="viewToggleBtn" class="theme-toggle" aria-label="Toggle PC and Phone View">📱 Phone Mode</button>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙 Dark Mode</button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <details class="filter-menu-details" id="filterMenu" open>
                <summary>⚙️ Filter Options</summary>
                
                <div class="filter-menu-content">
                    <div class="filter-group">
                        <h3>Select Categories</h3>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="CPU"> Processors (CPU)</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="GPU"> Graphics Cards (GPU)</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="RAM"> Memory (RAM)</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="Motherboard"> Motherboards</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="PSU"> Power Supply (PSU)</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="Cooler"> CPU Coolers</label>
                        <label class="filter-label"><input type="checkbox" class="category-filter" value="Case"> PC Cases</label>
                    </div>

                    <div class="filter-group">
                        <h3>Max Price: $
                            <input type="number" id="priceInput" class="price-input" min="20" max="3000" value="2500" aria-label="Type maximum price">
                        </h3>
                        <input type="range" id="priceRange" min="20" max="3000" value="2500" aria-label="Adjust maximum price slider">
                    </div>
                </div>
            </details>
        </aside>

        <main class="main-content" id="productGrid">
            <!-- Dropdowns generated by JS -->
        </main>
    </div>

    <!-- Re-named Floating Button -->
    <button id="floatingCompareBtn" class="floating-btn">PC Builder / Compare (0)</button>

    <!-- Comparison Modal -->
    <div id="compareModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="compareTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="compareTitle">Builder & Compatibility Check</h2>
                <button id="closeCompareBtn" class="close-btn" aria-label="Close modal">&times;</button>
            </div>
            <div class="table-responsive" id="compareTableContainer"></div>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="detailsModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
        <div class="modal-content details-modal-content">
            <div class="modal-header">
                <h2 id="detailsTitle">Part Name</h2>
                <button id="closeDetailsBtn" class="close-btn" aria-label="Close details modal">&times;</button>
            </div>
            <div class="details-body" id="detailsBody"></div>
        </div>
    </div>

    <script>
        // --- View Mode Toggle Logic (PC vs Phone) ---
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        const viewportMeta = document.getElementById('viewportMeta');
        
        let isMobileMode = window.innerWidth <= 900;
        viewToggleBtn.innerHTML = isMobileMode ? '💻 PC Mode' : '📱 Phone Mode';

        viewToggleBtn.addEventListener('click', () => {
            isMobileMode = !isMobileMode;
            if (isMobileMode) {
                document.body.classList.remove('force-desktop');
                document.body.classList.add('force-mobile');
                viewToggleBtn.innerHTML = '💻 PC Mode';
                viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0');
            } else {
                document.body.classList.remove('force-mobile');
                document.body.classList.add('force-desktop');
                viewToggleBtn.innerHTML = '📱 Phone Mode';
                if (window.screen.width <= 900 || window.innerWidth <= 900) {
                    viewportMeta.setAttribute('content', 'width=1200');
                } else {
                    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0');
                }
            }
        });

        // --- Theme Toggle Logic ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.innerHTML = '☀️ Light Mode';
        }
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.innerHTML = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                themeToggleBtn.innerHTML = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        });

        // --- Mock Database (145 Items) ---
        let partsDatabase = [

            { id: 2, name: "Intel Core i7-14700K", category: "CPU", price: 399, powerDraw: 253, image: "https://c1.neweggimages.com/productimage/nb1280/19-118-466-04.jpg", specs: "20 Cores (8P+12E), 28 Threads, Up to 5.6 GHz" },
            { id: 3, name: "Intel Core i5-14600K", category: "CPU", price: 299, powerDraw: 181, image: "https://c1.neweggimages.com/productimage/nb1280/19-118-470-07.jpg", specs: "14 Cores (6P+8E), 20 Threads, Up to 5.3 GHz" },
            { id: 4, name: "Intel Core i9-13900K", category: "CPU", price: 549, powerDraw: 253, image: "https://c1.neweggimages.com/ProductImageCompressAll1280/19-118-412-V01.jpg", specs: "24 Cores, 32 Threads, Up to 5.8 GHz" },
            { id: 5, name: "Intel Core i7-13700K", category: "CPU", price: 365, powerDraw: 253, image: "https://c1.neweggimages.com/productimage/nb1280/19-118-414-V01.jpg", specs: "16 Cores, 24 Threads, Up to 5.4 GHz" },
            { id: 6, name: "Intel Core i5-13600K", category: "CPU", price: 285, powerDraw: 181, image: "https://c1.neweggimages.com/productimage/nb1280/19-118-416-V01.jpg", specs: "14 Cores, 20 Threads, Up to 5.1 GHz" },
            { id: 7, name: "Intel Core i5-13400F", category: "CPU", price: 185, powerDraw: 65, image: "https://c1.neweggimages.com/ProductImageCompressAll1280/19-118-431-04.jpg", specs: "10 Cores, 16 Threads, Up to 4.6 GHz" },
            { id: 8, name: "Intel Core i3-13100F", category: "CPU", price: 110, powerDraw: 58, image: "https://c1.neweggimages.com/productimage/nb1280/19-118-433-02.png", specs: "4 Cores, 8 Threads, Up to 4.5 GHz" },

        ];

        // --- Data Enrichment & Compatibility Engine ---
        partsDatabase = partsDatabase.map(part => {
            let dimensions = "Not specified";
            let extendedDetails = {};
            let compat = { socket: null, ramType: null, formFactor: null, maxFormFactor: null };

            if (part.category === 'GPU') {
                dimensions = "336mm (L) x 140mm (W) x 61mm (H) [3-slot]";
                extendedDetails = { "Interface": "PCIe 4.0 x16", "Recommended PSU": "850W", "Ports": "3x DisplayPort 1.4a, 1x HDMI 2.1" };
            } 
            else if (part.category === 'CPU') {
                dimensions = "37.5mm x 37.5mm";
                extendedDetails = { "Socket": part.specs.includes('LGA') ? 'LGA 1700' : 'AM5 / AM4', "Integrated Graphics": "Yes / Varies", "Cooler Included": "No" };
                
                if (part.name.includes('Intel')) {
                    compat.socket = 'LGA 1700';
                    compat.ramType = 'DDR5'; // Modern Intel assumed DDR5 preferred
                } else if (part.name.includes('79') || part.name.includes('78') || part.name.includes('77') || part.name.includes('76')) {
                    compat.socket = 'AM5';
                } else {
                    compat.socket = 'AM4';
                }
            } 
            else if (part.category === 'Motherboard') {
                const isATX = part.specs.includes('ATX') && !part.specs.includes('Micro');
                dimensions = isATX ? "305mm x 244mm (ATX)" : "244mm x 244mm (Micro-ATX)";
                extendedDetails = { "Form Factor": isATX ? "ATX" : "Micro-ATX", "M.2 Slots": "3x PCIe 4.0 NVMe", "Rear USB Ports": "8-10 ports" };
                
                if (part.specs.includes('LGA 1700')) compat.socket = 'LGA 1700';
                else if (part.specs.includes('AM5')) compat.socket = 'AM5';
                else if (part.specs.includes('AM4')) compat.socket = 'AM4';

                if (part.specs.includes('DDR4') && !part.specs.includes('DDR5')) compat.ramType = 'DDR4';
                else if (part.specs.includes('DDR4/DDR5')) compat.ramType = 'DDR4/DDR5';
                else compat.ramType = 'DDR5';

                if (part.specs.includes('E-ATX')) compat.formFactor = 3;
                else if (part.specs.includes('Micro-ATX')) compat.formFactor = 1;
                else compat.formFactor = 2; // ATX
            } 
            else if (part.category === 'RAM') {
                dimensions = "133.35mm x 34.1mm x 7.1mm";
                extendedDetails = { "Modules": "2 Sticks", "Voltage": "1.35V - 1.4V", "Heat Spreader": "Aluminum" };
                compat.ramType = part.specs.includes('DDR4') ? 'DDR4' : 'DDR5';
            } 
            else if (part.category === 'PSU') {
                dimensions = part.specs.includes('SFX') ? "125mm x 100mm x 63.5mm" : "150mm x 160mm x 86mm";
                extendedDetails = { "Form Factor": part.specs.includes('SFX') ? "SFX" : "ATX", "Fan Size": "135mm FDB Fan", "Cabling": "Fully Modular" };
            } 
            else if (part.category === 'Case') {
                dimensions = "460mm x 225mm x 490mm (Avg)";
                extendedDetails = { "Form Factor": "ATX Mid Tower", "Included Fans": "2x 120mm", "Front Panel": "Mesh / Glass" };
                
                if (part.specs.includes('E-ATX')) compat.maxFormFactor = 3;
                else if (part.specs.includes('Micro-ATX')) compat.maxFormFactor = 1;
                else compat.maxFormFactor = 2; // ATX Mid
            } 
            else if (part.category === 'Cooler') {
                dimensions = part.name.includes('360') ? "397mm x 120mm x 27mm" : "125mm x 135mm x 155mm";
                extendedDetails = { "Type": part.name.includes('360') ? "AIO Liquid Cooler" : "Air Cooler", "Socket Support": "LGA 1700 / AM5", "Noise Level": "29.5 dBA" };
            }

            return { ...part, dimensions, extendedDetails, compat };
        });

        // --- Compatibility Checker Engine ---
        function checkCompatibility(items) {
            let errors = [];
            let warnings = [];

            const cpu = items.find(i => i.category === 'CPU');
            const mobo = items.find(i => i.category === 'Motherboard');
            const ram = items.find(i => i.category === 'RAM');
            const pcase = items.find(i => i.category === 'Case');
            const psu = items.find(i => i.category === 'PSU');
            
            let totalPower = 0;
            items.forEach(i => {
                if(i.category !== 'PSU' && i.category !== 'Case') {
                    totalPower += i.powerDraw || 0;
                }
            });

            // 1. CPU & Motherboard
            if (cpu && mobo) {
                if (cpu.compat.socket !== mobo.compat.socket) {
                    errors.push(`<strong>Socket Mismatch:</strong> ${cpu.name} uses ${cpu.compat.socket}, but the ${mobo.name} uses ${mobo.compat.socket}.`);
                }
            }

            // 2. Motherboard & RAM
            if (mobo && ram) {
                if (mobo.compat.ramType !== 'DDR4/DDR5' && mobo.compat.ramType !== ram.compat.ramType) {
                    errors.push(`<strong>RAM Mismatch:</strong> ${mobo.name} supports ${mobo.compat.ramType}, but the ${ram.name} is ${ram.compat.ramType}.`);
                }
            }

            // 3. Motherboard & Case
            if (mobo && pcase) {
                if (mobo.compat.formFactor > pcase.compat.maxFormFactor) {
                    let mType = mobo.compat.formFactor === 3 ? "E-ATX" : "ATX";
                    let cType = pcase.compat.maxFormFactor === 2 ? "ATX" : "Micro-ATX";
                    errors.push(`<strong>Size Mismatch:</strong> ${mobo.name} is an ${mType} board, but the ${pcase.name} only supports up to ${cType}.`);
                }
            }

            // 4. Power Supply
            if (psu) {
                let estimatedTotal = totalPower + 100; // Buffer for fans/drives
                if (estimatedTotal > psu.powerDraw) {
                    errors.push(`<strong>Insufficient Power:</strong> Your system draws an estimated ${estimatedTotal}W, but your PSU only provides ${psu.powerDraw}W.`);
                } else if (estimatedTotal > psu.powerDraw * 0.85) {
                    warnings.push(`<strong>Low Power Headroom:</strong> Your system draws an estimated ${estimatedTotal}W. A ${psu.powerDraw}W PSU is cutting it close.`);
                }
            } else if (totalPower > 0) {
                warnings.push(`Estimated system power draw is ${totalPower + 100}W. Don't forget to add a sufficient Power Supply!`);
            }

            return { errors, warnings };
        }

        // --- State ---
        let currentFilteredProducts = partsDatabase;
        let comparisonList = [];

        // --- DOM Elements ---
        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const priceRange = document.getElementById('priceRange');
        const priceInput = document.getElementById('priceInput');
        const categoryCheckboxes = document.querySelectorAll('.category-filter');
        const floatingCompareBtn = document.getElementById('floatingCompareBtn');
        const compareModal = document.getElementById('compareModal');
        const closeCompareBtn = document.getElementById('closeCompareBtn');
        const compareTableContainer = document.getElementById('compareTableContainer');
        const detailsModal = document.getElementById('detailsModal');
        const closeDetailsBtn = document.getElementById('closeDetailsBtn');
        const detailsBody = document.getElementById('detailsBody');
        const detailsTitle = document.getElementById('detailsTitle');

        // --- Render Products separated into Category Dropdowns ---
        function renderProducts(products) {
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results"><h3>No parts found</h3><p>Try adjusting your search or filters.</p></div>';
                return;
            }

            const categories = ['CPU', 'GPU', 'RAM', 'Motherboard', 'PSU', 'Cooler', 'Case'];
            const categoryLabels = {
                'CPU': '🖥️ Processors (CPU)',
                'GPU': '🎮 Graphics Cards (GPU)',
                'RAM': '🖴 Memory (RAM)',
                'Motherboard': '🎛️ Motherboards',
                'PSU': '⚡ Power Supplies (PSU)',
                'Cooler': '❄️ CPU Coolers',
                'Case': '🗄️ PC Cases'
            };

            categories.forEach(cat => {
                const catProducts = products.filter(p => p.category === cat);
                if (catProducts.length === 0) return;

                const section = document.createElement('details');
                section.className = 'category-section';
                section.open = true;

                const summary = document.createElement('summary');
                summary.innerHTML = `<span>${categoryLabels[cat]} <span style="font-size:1rem; color:var(--text-light); font-weight:normal;">(${catProducts.length} items)</span></span>`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'category-content';

                catProducts.forEach(part => {
                    const isCompared = comparisonList.includes(part.id);
                    const btnClass = isCompared ? 'btn selected' : 'btn';
                    const btnText = isCompared ? '✓ Added to Compare' : '+ Add to Compare';
                    
                    const isPSU = part.category === 'PSU';
                    const powerLabel = isPSU ? `⚡ ${part.powerDraw}W Max Capacity` : `⚡ ${part.powerDraw}W Power Draw`;
                    const powerClass = (isPSU || part.category === 'Case') ? 'power-draw psu' : 'power-draw';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetailsModal(part.id);

                    card.innerHTML = `
                        <img src="${part.image}" alt="${part.name}" class="card-img" loading="lazy">
                        <span class="category-badge">${part.category}</span>
                        <h3>${part.name}</h3>
                        <div class="price">$${part.price}</div>
                        <div class="specs">
                            <strong>Brief Specs:</strong>
                            ${part.specs}<br>
                            <span class="${powerClass}">${part.category === 'Case' ? '🖥️ PC Case' : powerLabel}</span>
                        </div>
                        <button class="${btnClass}" onclick="event.stopPropagation(); toggleCompare(${part.id})" aria-label="${isCompared ? 'Remove from comparison' : 'Add to comparison'}">${btnText}</button>
                    `;
                    contentDiv.appendChild(card);
                });

                section.appendChild(summary);
                section.appendChild(contentDiv);
                grid.appendChild(section);
            });
        }

        // --- Product Details Modal Logic ---
        function openDetailsModal(id) {
            const part = partsDatabase.find(p => p.id === id);
            if (!part) return;

            detailsTitle.textContent = part.name;
            
            let detailsListHtml = '';
            for (const [key, value] of Object.entries(part.extendedDetails)) {
                detailsListHtml += `<li><strong>${key}:</strong> <span>${value}</span></li>`;
            }

            detailsBody.innerHTML = `
                <img src="${part.image}" alt="${part.name}" class="details-image">
                <div class="details-info">
                    <span class="category-badge" style="display:inline-block;">${part.category}</span>
                    <div class="price" style="margin: 0;">$${part.price}</div>
                    
                    <h3>Technical Specifications</h3>
                    <ul class="details-specs-list">
                        <li><strong>Base Specs:</strong> <span>${part.specs}</span></li>
                        ${part.category !== 'Case' ? `<li><strong>Power ${part.category === 'PSU' ? 'Capacity' : 'Draw'}:</strong> <span>${part.powerDraw}W</span></li>` : ''}
                        ${detailsListHtml}
                        <li><strong>Dimensions:</strong> <span>${part.dimensions}</span></li>
                    </ul>
                </div>
            `;

            detailsModal.style.display = 'flex';
            closeDetailsBtn.focus();
        }

        function closeDetails() {
            detailsModal.style.display = 'none';
        }

        // --- Comparison Logic ---
        function toggleCompare(id) {
            const index = comparisonList.indexOf(id);
            if (index > -1) {
                comparisonList.splice(index, 1); 
            } else {
                if (comparisonList.length >= 8) {
                    alert("You can only compare up to 8 items in your PC build.");
                    return;
                }
                comparisonList.push(id); 
            }
            
            renderProducts(currentFilteredProducts);
            updateFloatingButton();
            
            if (compareModal.style.display === 'flex') {
                renderComparisonTable();
                if(comparisonList.length === 0) closeCompareModal();
            }
        }

        function updateFloatingButton() {
            if (comparisonList.length > 0) {
                floatingCompareBtn.style.display = 'block';
                floatingCompareBtn.textContent = `PC Builder / Compare (${comparisonList.length})`;
            } else {
                floatingCompareBtn.style.display = 'none';
            }
        }

        function renderComparisonTable() {
            if (comparisonList.length === 0) {
                compareTableContainer.innerHTML = '<p>No items selected.</p>';
                return;
            }

            const itemsToCompare = comparisonList.map(id => partsDatabase.find(p => p.id === id));
            
            // Generate Compatibility Banner
            let compatHtml = '';
            if (itemsToCompare.length > 1) {
                const issues = checkCompatibility(itemsToCompare);
                if (issues.errors.length === 0 && issues.warnings.length === 0) {
                    compatHtml = '<div class="compat-success">✅ Compatibility Check: All selected parts appear to be compatible!</div>';
                } else {
                    compatHtml = '<div class="compat-error">';
                    if (issues.errors.length > 0) {
                        compatHtml += '<h3>⚠️ Compatibility Errors Found</h3><ul>';
                        issues.errors.forEach(e => compatHtml += `<li>❌ ${e}</li>`);
                        compatHtml += '</ul><br>';
                    }
                    if (issues.warnings.length > 0) {
                        if(issues.errors.length === 0) compatHtml += '<h3>⚠️ Warnings</h3>';
                        compatHtml += '<ul>';
                        issues.warnings.forEach(w => compatHtml += `<li>⚠️ ${w}</li>`);
                        compatHtml += '</ul>';
                    }
                    compatHtml += '</div>';
                }
            } else {
                compatHtml = '<div style="background: var(--bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; color: var(--text-light);">ℹ️ Add more parts to check compatibility.</div>';
            }

            let html = compatHtml + '<table class="compare-table">';
            
            html += '<tr><th>Image</th>';
            itemsToCompare.forEach(item => { html += `<td><img src="${item.image}" alt="${item.name}" class="table-img"></td>`; });
            html += '</tr><tr><td>Model</td>';
            itemsToCompare.forEach(item => { html += `<td><strong>${item.name}</strong></td>`; });
            html += '</tr><tr><td>Category</td>';
            itemsToCompare.forEach(item => { html += `<td><span class="category-badge" style="display:inline-block;">${item.category}</span></td>`; });
            html += '</tr><tr><td>Price</td>';
            itemsToCompare.forEach(item => { html += `<td class="price" style="margin:0;">$${item.price}</td>`; });
            html += '</tr><tr><td>Power / Capacity</td>';
            itemsToCompare.forEach(item => { 
                if (item.category === 'Case') {
                    html += `<td><strong>N/A</strong></td>`;
                } else {
                    const label = item.category === 'PSU' ? '(Max Capacity)' : '(Power Draw)';
                    html += `<td><strong>${item.powerDraw}W</strong> <br><span style="font-size:0.85em; color:var(--text-light)">${label}</span></td>`; 
                }
            });
            html += '</tr><tr><td>Base Specs</td>';
            itemsToCompare.forEach(item => { html += `<td>${item.specs}</td>`; });
            html += '</tr><tr><td>Dimensions</td>';
            itemsToCompare.forEach(item => { html += `<td>${item.dimensions}</td>`; });
            html += '</tr><tr><td>Action</td>';
            itemsToCompare.forEach(item => { html += `<td><button class="btn btn-remove" onclick="toggleCompare(${item.id})">Remove Item</button></td>`; });
            html += '</tr></table>';
            
            compareTableContainer.innerHTML = html;
        }

        function openCompareModal() {
            renderComparisonTable();
            compareModal.style.display = 'flex';
            closeCompareBtn.focus();
        }

        function closeCompareModal() { compareModal.style.display = 'none'; }

        // --- Filter Logic ---
        function filterProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            const maxPrice = parseInt(priceInput.value) || 3000;
            const activeCategories = Array.from(categoryCheckboxes).filter(cb => cb.checked).map(cb => cb.value);

            currentFilteredProducts = partsDatabase.filter(part => {
                const matchesSearch = part.name.toLowerCase().includes(searchTerm) || part.specs.toLowerCase().includes(searchTerm);
                const matchesPrice = part.price <= maxPrice;
                const matchesCategory = activeCategories.length === 0 || activeCategories.includes(part.category);
                return matchesSearch && matchesPrice && matchesCategory;
            });

            renderProducts(currentFilteredProducts);
        }

        // --- Event Listeners ---
        searchInput.addEventListener('input', filterProducts);
        
        priceRange.addEventListener('input', (e) => { 
            priceInput.value = e.target.value; 
            filterProducts(); 
        });
        
        priceInput.addEventListener('input', (e) => { 
            let val = parseInt(e.target.value);
            if(isNaN(val) || val < 0) val = 3000;
            priceRange.value = val;
            filterProducts(); 
        });
        
        categoryCheckboxes.forEach(cb => {
            cb.addEventListener('change', filterProducts);
            cb.addEventListener('keydown', (e) => { if(e.key === 'Enter') { cb.checked = !cb.checked; filterProducts(); }});
        });

        floatingCompareBtn.addEventListener('click', openCompareModal);
        closeCompareBtn.addEventListener('click', closeCompareModal);
        closeDetailsBtn.addEventListener('click', closeDetails);
        
        window.addEventListener('click', (e) => {
            if (e.target === compareModal) closeCompareModal();
            if (e.target === detailsModal) closeDetails();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (compareModal.style.display === 'flex') closeCompareModal();
                if (detailsModal.style.display === 'flex') closeDetails();
            }
        });

        if (window.innerWidth <= 900) {
            document.getElementById('filterMenu').removeAttribute('open');
        }

        // Initial Render
        renderProducts(partsDatabase);
    </script>
</body>
</html>
